<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: ocut-media:; media-src ocut-media: blob:; connect-src 'self' ocut-media:">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O-CUT</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M24 7a12 12 0 1 0 1 17"/><path d="M15 17 29 3"/></svg><span>O-CUT</span><span class="edition">STUDIO</span></div>
    <div class="document-name"><span class="document-dot"></span><span id="documentTitle">새 프로젝트</span><span id="saveState" class="muted">저장 전</span></div>
    <div class="top-actions"><button id="newProject" class="quiet">새 프로젝트</button><button id="openProject" class="quiet">열기</button><span class="divider"></span><button id="undo" class="icon-button" title="실행 취소 (Ctrl+Z)" aria-label="실행 취소">↶</button><button id="redo" class="icon-button" title="다시 실행 (Ctrl+Shift+Z)" aria-label="다시 실행">↷</button><button id="save" class="secondary">저장</button><button id="saveAs" class="quiet" title="다른 이름으로 저장">다른 이름으로</button></div>
  </header>
  <main class="workspace">
    <aside class="library">
      <div class="panel-head"><h1>프로젝트 미디어</h1><span class="count" id="mediaCount">0</span></div>
      <div id="libraryContent" class="library-content"><div class="empty-library"><div class="empty-symbol">＋</div><h2>이야기가 시작될 공간</h2><p>프로젝트의 영상과 음악이<br>이곳에 모입니다.</p></div></div>
      <div class="library-footer"><span class="dot"></span>내 컴퓨터에 저장되는 프로젝트</div>
    </aside>
    <section class="monitor-panel" aria-label="영상 미리보기">
      <div class="panel-head"><h2>미리보기</h2><span id="canvasInfo" class="muted"></span></div>
      <div class="monitor-space"><div class="monitor-frame"><canvas id="preview" width="1920" height="1080"></canvas><div id="previewEmpty"><span class="preview-mark">O-CUT</span><p>나만의 장면을 만들어 보세요</p></div></div></div>
      <div class="transport"><span id="timecode">00:00.000</span><span class="transport-label" id="monitorMessage">프로젝트 준비됨</span><span id="duration">00:00.000</span></div>
    </section>
    <aside class="inspector">
      <div class="panel-head"><h2 id="inspectorTitle">프로젝트</h2><span class="overline">INSPECTOR</span></div>
      <form id="projectForm" class="inspector-form">
        <div class="section-caption">기본 설정</div>
        <label>프로젝트 이름<input id="projectName" maxlength="200" required></label>
        <label>화면 크기<select id="resolution"><option value="1280,720">1280 × 720 · HD</option><option value="1920,1080">1920 × 1080 · FHD</option><option value="2560,1440">2560 × 1440 · QHD</option><option value="3840,2160">3840 × 2160 · 4K</option></select></label>
        <label>프레임 레이트<select id="fps"><option>24</option><option>25</option><option selected>30</option><option>50</option><option>60</option></select></label>
        <button type="submit" class="secondary full">프로젝트 설정 적용</button>
        <div class="inspector-note"><span class="overline">YOUR WORK, YOUR FILES</span><p>영상과 음악의 원본을 유지하며<br>편집 내용은 .ocut 파일에 저장합니다.</p></div>
      </form>
    </aside>
    <section class="timeline-panel" aria-label="타임라인">
      <div class="timeline-toolbar"><div><strong>타임라인</strong><span class="muted" id="clipCount">클립 0개</span></div><span class="muted">프로젝트의 모든 장면을 한곳에서</span></div>
      <div id="timeline" class="timeline"><div id="trackHeaders" class="track-headers"></div><div id="timelineBody" class="timeline-body"><div class="ruler"><span>00:00</span></div><div id="tracks"></div></div></div>
    </section>
  </main>
  <footer class="statusbar"><span id="status" role="status" aria-live="polite">준비 중…</span><span>O-CUT · 로컬 스튜디오</span></footer>
  <script src="app.js"></script>
</body>
</html>
